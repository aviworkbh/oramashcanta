name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # השינוי כאן: בודקים אם יש תיקיית dist, ואם לא - משתמשים בתיקיית build או המקור הקיים של Lovable
          path: |
            ${{ sed -n 's/.*"outDir": "\(.*\)".*/\1/p' tsconfig.json 2>/dev/null || echo 'dist' }}
            ./dist
            ./build
            .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
